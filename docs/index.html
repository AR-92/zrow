<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zrow — Database Manager</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2360a5fa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cellipse cx='12' cy='5' rx='9' ry='3'/%3E%3Cpath d='M21 12c0 1.66-4 3-9 3s-9-1.34-9-3'/%3E%3Cpath d='M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="dist/styles.css" />
</head>
<body class="flex h-screen overflow-hidden bg-gray-950 text-gray-100 font-sans antialiased selection:bg-blue-500/30">

  <aside id="sidebar" class="flex flex-col shrink-0 bg-gray-900 border-r border-gray-800/60" style="width:240px">
    <div class="flex items-center gap-1.5 px-4 py-2 shrink-0 select-none">
      <i data-lucide="database" class="w-4 h-4 text-blue-400"></i>
      <span class="text-xs font-semibold tracking-tight text-gray-400">Zrow</span>
      <span class="text-[9px] text-gray-700">v1.0</span>
    </div>
    <div class="flex items-center justify-between px-4 py-1.5 shrink-0">
      <span class="text-[11px] font-semibold text-gray-500 tracking-wider uppercase">Connections</span>
      <button id="btn-new-connection" class="flex items-center justify-center w-4 h-4 text-gray-500 hover:text-gray-200 hover:bg-gray-700 transition-all rounded-sm" title="New Connection">
        <i data-lucide="plus" class="w-3 h-3"></i>
      </button>
    </div>
    <div id="connection-list" class="flex-1 overflow-y-auto pb-2"></div>
    <div class="flex items-center gap-2 px-4 py-1.5 border-t border-gray-800/60 shrink-0 text-[11px] text-gray-500">
      <span id="status-icon" class="w-1.5 h-1.5 rounded-full inline-block bg-gray-600"></span>
      <span id="status-text">Ready</span>
    </div>
  </aside>

  <div class="flex flex-col flex-1 min-w-0">
    <div class="flex flex-1 overflow-hidden">
      <div class="flex flex-col flex-1 min-w-0">
        <div id="tab-bar" class="flex items-stretch overflow-x-auto scrollbar-none shrink-0 bg-gray-900/50"></div>
        <div id="editor-area" class="flex-1 flex flex-col overflow-hidden">
          <div id="editor-container" class="flex-1 flex flex-col overflow-hidden"></div>
          <div id="resize-handle" class="h-1.5 bg-gray-800 hover:bg-blue-500/30 cursor-s-resize shrink-0 transition-colors"></div>
          <div id="results-container" class="flex flex-col overflow-hidden" style="min-height:100px"></div>
        </div>
      </div>
    </div>
    <footer class="flex items-center px-3 py-[3px] border-t border-gray-800/60 shrink-0 text-[11px] bg-gray-900/50 text-gray-500 gap-3">
      <button id="btn-new-tab" class="flex items-center gap-1 text-gray-500 hover:text-gray-300 transition-colors cursor-pointer py-[1px]">
        <i data-lucide="plus" class="w-2.5 h-2.5"></i>
        <span>New Tab</span>
      </button>
      <span class="w-px h-3 bg-gray-800 shrink-0"></span>
      <button id="btn-toggle-theme" class="flex items-center justify-center text-gray-500 hover:text-gray-300 transition-colors cursor-pointer py-[1px]" title="Toggle Theme">
        <i data-lucide="moon" class="w-2.5 h-2.5"></i>
      </button>
      <a href="https://github.com/anomalyco/opencode" target="_blank" class="flex items-center justify-center text-gray-500 hover:text-gray-300 transition-colors py-[1px]">
        <svg class="w-2.5 h-2.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
      </a>
      <span class="flex-1"></span>
      <span id="status-query-info" class="text-gray-600"></span>
    </footer>
  </div>

  <div id="modal-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center">
    <div id="modal-content" class="bg-gray-900 border border-gray-700/60 rounded-xl shadow-2xl w-full max-w-lg mx-4 overflow-hidden"></div>
  </div>

  <script src="dist/vendor/sql-wasm.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script type="module" src="dist/app.js"></script>
</body>
</html>
